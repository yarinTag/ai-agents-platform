$defs:
  AuthoringMetadata:
    additionalProperties: false
    properties:
      unresolved_requirements:
        items:
          maxLength: 2000
          minLength: 1
          type: string
        maxItems: 100
        title: Unresolved Requirements
        type: array
    title: AuthoringMetadata
    type: object
  AuthoringStep:
    additionalProperties: false
    properties:
      key:
        maxLength: 120
        minLength: 1
        pattern: ^[a-zA-Z0-9_-]+$
        title: Key
        type: string
      name:
        maxLength: 200
        minLength: 1
        title: Name
        type: string
      agent_id:
        maxLength: 200
        minLength: 1
        title: Agent Id
        type: string
      prompt_template:
        maxLength: 16000
        minLength: 1
        title: Prompt Template
        type: string
      depends_on:
        items:
          maxLength: 120
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          type: string
        maxItems: 100
        title: Depends On
        type: array
      timeout_seconds:
        default: 180
        maximum: 300
        minimum: 1
        title: Timeout Seconds
        type: integer
      skills:
        items:
          maxLength: 200
          minLength: 1
          type: string
        maxItems: 100
        title: Skills
        type: array
      mcp_servers:
        items:
          maxLength: 200
          minLength: 1
          type: string
        maxItems: 100
        title: Mcp Servers
        type: array
      params:
        $ref: '#/$defs/ResourceBindings'
    required:
    - key
    - name
    - agent_id
    - prompt_template
    title: AuthoringStep
    type: object
  AuthoringTrigger:
    additionalProperties: false
    properties:
      event:
        enum:
        - manual
        - webhook
        - cron
        - channel_message
        - pull_request.opened
        - pull_request.updated
        - push
        title: Event
        type: string
      connector_id:
        anyOf:
        - maxLength: 200
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Connector Id
      repository:
        anyOf:
        - maxLength: 500
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Repository
      channel_id:
        anyOf:
        - maxLength: 200
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Channel Id
    required:
    - event
    title: AuthoringTrigger
    type: object
  ChannelReference:
    additionalProperties: false
    properties:
      connector_id:
        maxLength: 200
        minLength: 1
        title: Connector Id
        type: string
      channel_id:
        maxLength: 200
        minLength: 1
        title: Channel Id
        type: string
    required:
    - connector_id
    - channel_id
    title: ChannelReference
    type: object
  FlowTransition:
    additionalProperties: false
    properties:
      from:
        maxLength: 120
        title: From
        type: string
      to:
        maxLength: 120
        minLength: 1
        pattern: ^[a-zA-Z0-9_-]+$
        title: To
        type: string
    required:
    - from
    - to
    title: FlowTransition
    type: object
  RepositoryReference:
    additionalProperties: false
    properties:
      connector_id:
        maxLength: 200
        minLength: 1
        title: Connector Id
        type: string
      repository:
        maxLength: 500
        minLength: 1
        title: Repository
        type: string
    required:
    - connector_id
    - repository
    title: RepositoryReference
    type: object
  ResourceBindings:
    additionalProperties: false
    properties:
      tools:
        items:
          $ref: '#/$defs/ToolReference'
        maxItems: 100
        title: Tools
        type: array
      repositories:
        items:
          $ref: '#/$defs/RepositoryReference'
        maxItems: 100
        title: Repositories
        type: array
      channels:
        items:
          $ref: '#/$defs/ChannelReference'
        maxItems: 100
        title: Channels
        type: array
      requires_approval:
        default: false
        title: Requires Approval
        type: boolean
    title: ResourceBindings
    type: object
  ToolReference:
    additionalProperties: false
    properties:
      connector_id:
        maxLength: 200
        minLength: 1
        title: Connector Id
        type: string
      tool_name:
        maxLength: 200
        minLength: 1
        title: Tool Name
        type: string
    required:
    - connector_id
    - tool_name
    title: ToolReference
    type: object
additionalProperties: false
properties:
  name:
    maxLength: 200
    minLength: 1
    title: Name
    type: string
  description:
    default: ''
    maxLength: 4000
    title: Description
    type: string
  triggers:
    items:
      $ref: '#/$defs/AuthoringTrigger'
    maxItems: 1
    minItems: 1
    title: Triggers
    type: array
  cron_expression:
    anyOf:
    - maxLength: 200
      type: string
    - type: 'null'
    default: null
    title: Cron Expression
  webhook_enabled:
    default: false
    title: Webhook Enabled
    type: boolean
  steps:
    items:
      $ref: '#/$defs/AuthoringStep'
    maxItems: 100
    minItems: 1
    title: Steps
    type: array
  flow:
    items:
      $ref: '#/$defs/FlowTransition'
    maxItems: 10000
    title: Flow
    type: array
  metadata:
    $ref: '#/$defs/AuthoringMetadata'
required:
- name
- triggers
- steps
title: WorkflowDocument
type: object
