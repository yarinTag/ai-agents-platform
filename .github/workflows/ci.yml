name: CI
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images (only main/master or v-prefixed tags)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Image plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      images: ${{ steps.plan.outputs.images }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        name: Select image matrix and trusted publishing mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          echo 'images={"include":[{"component":"api","context":".","file":"Dockerfile.api"},{"component":"worker","context":".","file":"Dockerfile.worker"},{"component":"dashboard","context":"poc/dashboard","file":"poc/dashboard/Dockerfile"}]}' >> "$GITHUB_OUTPUT"
          publish=false
          case "$REF" in
            refs/heads/main|refs/heads/master|refs/tags/v*)
              if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$REQUEST_PUBLISH" = true ]; }; then
                publish=true
              fi
              ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  backend:
    name: Backend tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            files: >-
              poc/tests/test_workflow_revisions.py
              poc/tests/test_workflow_origin.py
              poc/tests/test_workflow_playground.py
              poc/tests/test_direct_reasoning.py
              poc/tests/test_direct_pricing.py
              poc/tests/test_repo_cache.py
          - suite: security
            files: >-
              poc/tests/test_connector_execution_security.py
              poc/tests/test_workflow_chat.py
              poc/tests/test_workflow_pr_authoring.py
          - suite: runtime
            files: >-
              poc/tests/test_direct_runtime.py
              poc/tests/test_workflow_notification_modes.py
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM_DEV_MODE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --no-install-project
      - name: Check Python syntax
        run: uv run --no-sync python -m compileall -q poc
      - name: Run isolated backend tests
        env:
          TEST_FILES: ${{ matrix.files }}
        run: |
          read -r -a files <<< "$TEST_FILES"
          uv run --no-sync python -m pytest --noconftest -q "${files[@]}" --junitxml=reports/backend.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-tests-${{ matrix.suite }}
          path: reports/backend.xml
          if-no-files-found: ignore
          retention-days: 14
  frontend:
    name: Dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: poc/dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: poc/dashboard/package-lock.json
      - name: Install locked dashboard dependencies
        run: npm ci
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard TypeScript checks
        run: npx --no-install tsc --noEmit
      - name: Dashboard unit tests
        run: node --test tests/*.test.mjs
      - name: Dashboard production build
        run: npm run build
  containers:
    name: Container build (${{ matrix.component }})
    needs: plan
    if: needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build only; no registry credentials or publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=pr-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.component }}
  gate:
    name: CI required
    if: always()
    needs: [plan, backend, frontend, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CONTAINERS: ${{ needs.containers.result }}
        run: |
          test "$PLAN" = success
          test "$BACKEND" = success
          test "$FRONTEND" = success
          if [ "$PUBLISH" = true ]; then
            test "$CONTAINERS" = skipped
          else
            test "$CONTAINERS" = success
          fi
  publish:
    name: Publish image (${{ matrix.component }})
    needs: [plan, gate]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Normalize registry path
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
          flavor: latest=false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
