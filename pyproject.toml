[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-platform"
version = "0.1.0"
description = "Generic, multi-runtime AI Agents Office platform with live visualization"
readme = "poc/README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Agents Platform Team" }
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0,<0.28.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "croniter>=2.0.0",
    "qdrant-client>=1.19.1",
    "fastembed>=0.8.1",
    "cocoindex>=1.0.24",
    "aio-pika>=10.1.1",
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.pytest.ini_options]
testpaths = ["poc/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = [".", "poc"]
