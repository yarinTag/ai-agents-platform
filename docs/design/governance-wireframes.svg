<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1530" viewBox="0 0 1800 1530" role="img" aria-label="AI-14 proposed governance wireframes">
<rect width="100%" height="100%" fill="#0a0d12"/>
<text x="38" y="60" font-family="Arial,sans-serif" font-size="34" fill="#f0f6fc">Governed workflows / P00 UX wireframes</text>
<text x="38" y="97" font-family="Arial,sans-serif" font-size="20" fill="#fbbf24">PROPOSED DESIGN - static examples, not live screens or available integrations</text>
<text x="38" y="129" font-family="Arial,sans-serif" font-size="18" fill="#8b949e">Scope: organization / department / current effective role. Action authority stays on the server.</text>
<rect x="38" y="168" width="848" height="610" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="62" y="214" font-family="Arial,sans-serif" font-size="24" fill="#f0f6fc">01 / Department governance</text>
<text x="62" y="243" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Example organization  &gt;  Operations  |  Policy revision 12</text>
<rect x="693" y="192" width="165" height="28" rx="6" fill="#101b1b" stroke="#58a6ff"/>
<text x="703" y="211" font-family="Arial,sans-serif" font-size="14" fill="#58a6ff">ORG ADMIN</text>
<line x1="62" y1="262" x2="862" y2="262" stroke="#30363d"/>
<text x="62" y="299" font-family="Arial,sans-serif" font-size="18" fill="#10b981">Capabilities &amp; resources</text>
<text x="313" y="299" font-family="Arial,sans-serif" font-size="18" fill="#8b949e">Channels &amp; triggers</text>
<text x="552" y="299" font-family="Arial,sans-serif" font-size="18" fill="#8b949e">Approval policies</text>
<rect x="62" y="324" width="800" height="57" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="78" y="356" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">Effective access = granted action + exact resource + conditions</text>
<text x="70" y="420" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">ACTION / ADAPTER</text>
<text x="340" y="420" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">RESOURCE</text>
<text x="628" y="420" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">POLICY</text>
<line x1="62" y1="438" x2="862" y2="438" stroke="#30363d"/>
<text x="70" y="462" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">Read record / CRM</text>
<text x="340" y="462" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Approved project A</text>
<rect x="628" y="443" width="210" height="28" rx="6" fill="#101b1b" stroke="#10b981"/>
<text x="638" y="462" font-family="Arial,sans-serif" font-size="14" fill="#10b981">Allowed read</text>
<line x1="62" y1="492" x2="862" y2="492" stroke="#30363d"/>
<text x="70" y="516" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">Update record / CRM</text>
<text x="340" y="516" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Approved project A</text>
<rect x="628" y="497" width="210" height="28" rx="6" fill="#101b1b" stroke="#fbbf24"/>
<text x="638" y="516" font-family="Arial,sans-serif" font-size="14" fill="#fbbf24">Approval required</text>
<line x1="62" y1="546" x2="862" y2="546" stroke="#30363d"/>
<text x="70" y="570" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">Transition item / Tracker</text>
<text x="340" y="570" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Approved board B</text>
<rect x="628" y="551" width="210" height="28" rx="6" fill="#101b1b" stroke="#f87171"/>
<text x="638" y="570" font-family="Arial,sans-serif" font-size="14" fill="#f87171">Not granted</text>
<line x1="62" y1="600" x2="862" y2="600" stroke="#30363d"/>
<text x="70" y="624" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">Export data / Storage</text>
<text x="340" y="624" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">No adapter implementation</text>
<rect x="628" y="605" width="210" height="28" rx="6" fill="#101b1b" stroke="#8b949e"/>
<text x="638" y="624" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Unavailable</text>
<text x="64" y="696" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Configured credentials and live verification are separate statuses.</text>
<rect x="62" y="720" width="220" height="36" rx="6" fill="#0f4235" stroke="#10b981"/>
<text x="74" y="744" font-family="Arial,sans-serif" font-size="16" fill="#d1fae5">Review policy changes</text>
<text x="308" y="745" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Admin only; no automatic grants</text>
<rect x="914" y="168" width="848" height="610" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="938" y="214" font-family="Arial,sans-serif" font-size="24" fill="#f0f6fc">02 / Channels &amp; triggers</text>
<text x="938" y="243" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Channel identity is independent of who may trigger or approve.</text>
<rect x="1569" y="192" width="165" height="28" rx="6" fill="#101b1b" stroke="#58a6ff"/>
<text x="1579" y="211" font-family="Arial,sans-serif" font-size="14" fill="#58a6ff">ORG ADMIN</text>
<line x1="938" y1="262" x2="1738" y2="262" stroke="#30363d"/>
<text x="938" y="304" font-family="Arial,sans-serif" font-size="20" fill="#f0f6fc">Operations requests  /  Channel binding</text>
<rect x="938" y="324" width="121" height="28" rx="6" fill="#101b1b" stroke="#10b981"/>
<text x="948" y="343" font-family="Arial,sans-serif" font-size="14" fill="#10b981">Send enabled</text>
<rect x="1108" y="324" width="175" height="28" rx="6" fill="#101b1b" stroke="#fbbf24"/>
<text x="1118" y="343" font-family="Arial,sans-serif" font-size="14" fill="#fbbf24">Trigger disabled</text>
<rect x="1299" y="324" width="230" height="28" rx="6" fill="#101b1b" stroke="#58a6ff"/>
<text x="1309" y="343" font-family="Arial,sans-serif" font-size="14" fill="#58a6ff">Approval: linked users</text>
<text x="938" y="391" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">TRIGGER DRAFT</text>
<rect x="938" y="409" width="800" height="192" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="956" y="444" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">Saved workflow: Review item  /  revision 5</text>
<text x="956" y="480" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Match: explicit command /review  |  typed input: item_id</text>
<text x="956" y="516" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">Sender policy: linked, authorized users only</text>
<text x="956" y="552" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">Execution principal: requesting user  |  Fixed resource scope</text>
<text x="938" y="641" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Rule preview evaluates matching only. It sends and executes nothing.</text>
<rect x="938" y="661" width="190" height="36" rx="6" fill="#0f4235" stroke="#10b981"/>
<text x="950" y="685" font-family="Arial,sans-serif" font-size="16" fill="#d1fae5">Preview matching</text>
<rect x="1149" y="661" width="190" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
<text x="1161" y="685" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Enable trigger</text>
<text x="938" y="737" font-family="Arial,sans-serif" font-size="18" fill="#fbbf24">Blocked: verified event ingress is not configured.</text>
<text x="938" y="761" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Adding a channel never enables its listener automatically.</text>
<rect x="38" y="812" width="848" height="610" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="62" y="858" font-family="Arial,sans-serif" font-size="24" fill="#f0f6fc">03 / AI workflow plan</text>
<text x="62" y="887" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Member can author in this department. Activation requires a manager.</text>
<rect x="693" y="836" width="165" height="28" rx="6" fill="#101b1b" stroke="#58a6ff"/>
<text x="703" y="855" font-family="Arial,sans-serif" font-size="14" fill="#58a6ff">MEMBER</text>
<line x1="62" y1="906" x2="862" y2="906" stroke="#30363d"/>
<text x="62" y="946" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">Request: review an item; after approval, update its record.</text>
<rect x="62" y="976" width="490" height="56" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="78" y="1004" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">1. Read item</text>
<text x="313" y="1003" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Implemented read</text>
<rect x="62" y="1046" width="490" height="56" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="78" y="1074" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">2. Analyze evidence</text>
<text x="313" y="1073" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Model-only proposal</text>
<rect x="62" y="1116" width="490" height="56" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="78" y="1144" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">3. Human approval</text>
<text x="313" y="1143" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Wait; no worker held</text>
<rect x="62" y="1186" width="490" height="56" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="78" y="1214" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">4. Update record</text>
<text x="313" y="1213" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Granted write + approval</text>
<rect x="578" y="976" width="284" height="266" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="596" y="1013" font-family="Arial,sans-serif" font-size="18" fill="#f0f6fc">Resource preview</text>
<text x="596" y="1054" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Project A / exact item</text>
<text x="596" y="1091" font-family="Arial,sans-serif" font-size="16" fill="#fbbf24">Write requires approval</text>
<text x="596" y="1128" font-family="Arial,sans-serif" font-size="16" fill="#fbbf24">Missing setup is blocking.</text>
<text x="596" y="1166" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">No summary-only fallback.</text>
<text x="596" y="1203" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">No inferred permissions.</text>
<text x="62" y="1301" font-family="Arial,sans-serif" font-size="18" fill="#8b949e">Draft saved is not active. Approval is not a success receipt.</text>
<rect x="62" y="1334" width="215" height="36" rx="6" fill="#0f4235" stroke="#10b981"/>
<text x="74" y="1358" font-family="Arial,sans-serif" font-size="16" fill="#d1fae5">Save inactive draft</text>
<rect x="298" y="1334" width="150" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
<text x="310" y="1358" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Activate</text>
<text x="62" y="1403" font-family="Arial,sans-serif" font-size="14" fill="#fbbf24">Mid-DAG approval shown here is planned (P07), not shipped.</text>
<rect x="914" y="812" width="848" height="610" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="938" y="858" font-family="Arial,sans-serif" font-size="24" fill="#f0f6fc">04 / Approval &amp; execution</text>
<text x="938" y="887" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Arrived from a channel link; current platform authorization is required.</text>
<rect x="1569" y="836" width="165" height="28" rx="6" fill="#101b1b" stroke="#58a6ff"/>
<text x="1579" y="855" font-family="Arial,sans-serif" font-size="14" fill="#58a6ff">MANAGER</text>
<line x1="938" y1="906" x2="1738" y2="906" stroke="#30363d"/>
<rect x="938" y="928" width="220" height="28" rx="6" fill="#101b1b" stroke="#fbbf24"/>
<text x="948" y="947" font-family="Arial,sans-serif" font-size="14" fill="#fbbf24">Waiting for approval</text>
<text x="1178" y="949" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Execution  /  Action  /  Evidence version</text>
<rect x="938" y="979" width="800" height="176" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="956" y="1014" font-family="Arial,sans-serif" font-size="20" fill="#f0f6fc">Requested action: Update record</text>
<text x="956" y="1048" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">Resource: Project A / item 42  |  Evidence: version 8</text>
<text x="956" y="1084" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Changes: allowed fields only  |  Expiry: 24 hours</text>
<text x="956" y="1120" font-family="Arial,sans-serif" font-size="16" fill="#f0f6fc">View report, evidence and intended changes before deciding.</text>
<rect x="938" y="1180" width="225" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
<text x="950" y="1204" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Approve &amp; continue</text>
<rect x="1183" y="1180" width="125" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
<text x="1195" y="1204" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Reject</text>
<text x="938" y="1251" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Static wireframe - buttons do not submit a decision.</text>
<line x1="938" y1="1273" x2="1738" y2="1273" stroke="#30363d"/>
<text x="938" y="1312" font-family="Arial,sans-serif" font-size="20" fill="#f0f6fc">Decision recorded  !=  Action succeeded</text>
<text x="938" y="1347" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">The action still needs current policy, fresh evidence and a receipt.</text>
<text x="938" y="1387" font-family="Arial,sans-serif" font-size="16" fill="#fbbf24">Changed evidence: invalidate. Unknown outcome: reconcile, do not retry.</text>
<text x="38" y="1478" font-family="Arial,sans-serif" font-size="18" fill="#8b949e">AI-14  |  Existing dashboard colors, Ant Design cards/tags/tabs, and explicit state labels</text>
<text x="38" y="1506" font-family="Arial,sans-serif" font-size="16" fill="#8b949e">Illustrative future capabilities are not claims about current connectors. See governance-ux.md for roles, copy and acceptance.</text>
</svg>
